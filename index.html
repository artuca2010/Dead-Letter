<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lethal Letter</title>
    <head>
    <link rel="icon" href="Assets/death.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <main id="MainHandler">
        
        <!-- LADO DO JOGADOR 1 (Esquerda) -->
        <div class="player-side">
            <!-- Barra de Erro no Topo -->
            <div id="Player1Bar">
                <div><img src="" alt=""></div>
            </div>
            <!-- Palavra e Input abaixo da Barra -->
            <div id="Player1Word" class="word-display">_ _ _ _ _</div>
            <input type="text" id="Player1TyBar" maxlength="1" placeholder="A" autofocus autocomplete="off">
        </div>

        <!-- MAIN GAME SCREEN (Centro) -->
        <div id="GameScreen">
            <img src="Assets/Chair2.png" id="P2Chair" alt="Jogador Vermelho">
            <img src="Assets/Chair1.png" id="P1Chair" alt="Jogador Azul">
        </div> 

        <!-- LADO DO JOGADOR 2 (Direita) -->
        <div class="player-side">
            <!-- Barra de Erro no Topo -->
            <div id="Player2Bar"></div>
            <!-- Palavra e Input abaixo da Barra -->
            <div id="Player2Word" class="word-display">_ _ _ _ _</div>
            <input type="text" id="Player2TyBar" maxlength="1" placeholder="B" autocomplete="off">
        </div>

    </main>
</body>
<script src="script.js"></script>
</html
