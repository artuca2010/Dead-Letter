<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrong Way Down</title>
    <link rel="icon" href="Assets/death.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="Navbar">
            <img src="Assets/OpendTube.png" id="InfoIcon" alt="Ícone Informativo">
            <h1 id="NavInfo">Wrong Way Down</h1>
        </div>
    </header>

    <main id="MainHandler">
        <div id="Player2Side" class="player-side"></div>
        <div id="GameScreen">
            <div class="slot">
                <img src="Assets/Chair2.png" id="P2Chair" alt="Jogador Vermelho">
                <img src="Assets/ClosedTube.png" id="P2Tube" class="tube" alt="Tubo">
            </div>
            <div class="slot">
                <img src="Assets/Chair1.png" id="P1Chair" alt="Jogador Azul">
                <img src="Assets/ClosedTube.png" id="P1Tube" class="tube" alt="Tubo">
            </div>
            <div id="RoundInfo"></div>
            <button id="BtnComecar">Começar jogo</button>
        </div>
        <div id="Player1Side" class="player-side"></div>
    </main>

    <footer>
        <div id="CopyrightFooter">
            <p>All rights reserved Wrong side out, by artuca2010 &copy; 2026 // Github: </p>
        </div>
    </footer>

    <script src="interface.js"></script>
    <script src="script.js"></script>
</body>
</html>
